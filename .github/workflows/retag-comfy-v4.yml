# 给已有 digest 打新 tag，不重新构建。同 tag Flashboot 会继续吃旧层。
name: retag-comfy-v4

on:
  workflow_dispatch:

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 把 3f1850bc 标成从未用过的 tag
        run: |
          docker buildx imagetools create \
            -t liyouchang111/fig-comfy-worker:5.10.0-gguf-v4 \
            liyouchang111/fig-comfy-worker@sha256:3f1850bca6adbabd73919782694e7158eb6b1a3dd1baaf0449c04b5bcdbbc397
