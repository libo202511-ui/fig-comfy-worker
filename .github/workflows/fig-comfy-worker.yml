# 在 GitHub 上构建 fig Comfy Worker 并推到 Docker Hub
# 需仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
name: fig-comfy-worker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 默认会把大盘挂到代码目录，Docker/BuildKit 仍写 /var/lib/docker 会再次写满。
      # 必须把大盘挂到 Docker 数据目录，并重启守护进程。
      - name: 把空闲盘挂到 Docker
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192 # 根盘只留 checkout 和 apt 用量，其余全给 Docker
          temp-reserve-mb: 100
          swap-size-mb: 8192 # 导出层阶段内存吃紧，swap 给足避免 runner 被 OOM 掉线
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          build-mount-path: /var/lib/docker

      - name: 重启 Docker
        run: |
          sudo service docker restart
          df -h

      - uses: actions/checkout@v4

      # 用默认 docker-container 驱动：构建结果直接流式推到 Docker Hub。
      # 换回 driver: docker 会先落本地镜像库再推，导出阶段磁盘占两份，runner 会掉线。
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/runpod-comfy
          file: deploy/runpod-comfy/Dockerfile
          push: true
          # 只推固定版本 tag：浮动 tag 容易让 Endpoint 拉到旧镜像，也多占一次推送
          tags: liyouchang111/fig-comfy-worker:5.10.0-gguf-v16
          provenance: false
          sbom: false
