# 在 GitHub 上构建 fig Comfy Worker 并推到 Docker Hub
# 需仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
name: fig-comfy-worker

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 默认会把大盘挂到代码目录，Docker/BuildKit 仍写 /var/lib/docker 会再次写满。
      # 必须把大盘挂到 Docker 数据目录，并重启守护进程。
      - name: 把空闲盘挂到 Docker
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 12288
          temp-reserve-mb: 100
          swap-size-mb: 2048
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          build-mount-path: /var/lib/docker

      - name: 重启 Docker
        run: |
          sudo service docker restart
          df -h

      - uses: actions/checkout@v4

      # 不用独立 BuildKit 容器，避免镜像再拷一份把盘写满
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/runpod-comfy
          file: deploy/runpod-comfy/Dockerfile
          push: true
          tags: |
            liyouchang111/fig-comfy-worker:5.10.0
            liyouchang111/fig-comfy-worker:5.10.0-gguf
            liyouchang111/fig-comfy-worker:5.10.0-gguf-v7
          provenance: false
          sbom: false
